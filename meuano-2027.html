<!doctype html>
<html lang="pt-BR" data-paleta="lilas" data-escuro="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Ano 2027</title>
  <meta name="description" content="Organização pessoal para 2027: áreas da vida, metas, hábitos, feitos e muito mais.">
  <meta name="theme-color" content="#b39ae6">
  
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   Meu Ano 2027 — estilos
   Paletas: lilás (padrão) e rosa bebê, cada uma com modo escuro
   ========================================================= */

:root,
html[data-paleta="lilas"] {
  --bg: #f7f3fd;
  --bg-2: #efe7fb;
  --surface: #ffffff;
  --surface-2: #f4eefc;
  --surface-3: #e9dffa;
  --primary: #9b7dd6;
  --primary-strong: #6f4fb0;
  --primary-soft: #ece3fb;
  --on-primary: #ffffff;
  --accent: #f0a3c3;
  --accent-soft: #fde6ef;
  --text: #362a4d;
  --muted: #7c7096;
  --border: #e6dcf6;
  --ok: #4fa97a;
  --perigo: #d9546f;
  --sombra: 0 6px 24px rgba(120, 88, 186, 0.08), 0 1px 3px rgba(120, 88, 186, 0.08);
  --sombra-forte: 0 18px 50px rgba(90, 60, 150, 0.22);
  --hero: linear-gradient(135deg, #efe5fd 0%, #f8e7f3 60%, #fdf0f6 100%);
  color-scheme: light;
}

html[data-paleta="rosa"] {
  --bg: #fdf5f8;
  --bg-2: #fbe8f0;
  --surface: #ffffff;
  --surface-2: #fdeff4;
  --surface-3: #f9e0ea;
  --primary: #e38aae;
  --primary-strong: #b85582;
  --primary-soft: #fce3ed;
  --on-primary: #ffffff;
  --accent: #bfa1ea;
  --accent-soft: #efe6fb;
  --text: #4a2c3c;
  --muted: #92707f;
  --border: #f4d8e4;
  --sombra: 0 6px 24px rgba(200, 100, 145, 0.08), 0 1px 3px rgba(200, 100, 145, 0.08);
  --sombra-forte: 0 18px 50px rgba(160, 70, 115, 0.2);
  --hero: linear-gradient(135deg, #fde4ee 0%, #fbeaf3 55%, #efe7fc 100%);
}

html[data-escuro="1"] {
  --bg: #1b1625;
  --bg-2: #221b2f;
  --surface: #251f33;
  --surface-2: #2d263e;
  --surface-3: #3a3150;
  --primary: #b9a0ef;
  --primary-strong: #d6c6fb;
  --primary-soft: #3a2f56;
  --on-primary: #1b1625;
  --accent: #f0a9c8;
  --accent-soft: #4a2c40;
  --text: #f0eafb;
  --muted: #aa9fc1;
  --border: #3a3150;
  --ok: #7fd3a6;
  --perigo: #f08aa1;
  --sombra: 0 6px 24px rgba(0, 0, 0, 0.3);
  --sombra-forte: 0 18px 50px rgba(0, 0, 0, 0.5);
  --hero: linear-gradient(135deg, #2e2548 0%, #352540 60%, #3a2538 100%);
  color-scheme: dark;
}

html[data-escuro="1"][data-paleta="rosa"] {
  --bg: #211720;
  --bg-2: #2a1d28;
  --surface: #2c202a;
  --surface-2: #362833;
  --surface-3: #463340;
  --primary: #f2a5c4;
  --primary-strong: #f9c6da;
  --primary-soft: #4b2f40;
  --on-primary: #211720;
  --accent: #c8aef1;
  --accent-soft: #3a2f56;
  --text: #fbecf3;
  --muted: #c19fb0;
  --border: #463340;
  --hero: linear-gradient(135deg, #43283a 0%, #3b2636 55%, #30264a 100%);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.com-modal { overflow: hidden; }
h1, h2, h3, h4 {
  font-family: 'Quicksand', 'Nunito', sans-serif;
  font-weight: 700;
  line-height: 1.2;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: 1.9rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
a { color: var(--primary-strong); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.pequeno { font-size: 0.85rem; }
.centro { text-align: center; }
.espaco { flex: 1; }
.num { font-variant-numeric: tabular-nums; }
::selection { background: var(--primary-soft); }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 264px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 22px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.marca {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 12px;
  text-decoration: none;
  color: var(--text);
  font-family: 'Quicksand', sans-serif;
  font-size: 1.2rem;
}
.marca strong, .topbar-marca strong { color: var(--primary); }
.marca-logo {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: var(--hero);
  font-size: 1.3rem;
}
.nav-grupo { margin-bottom: 10px; }
.nav-grupo-titulo {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 6px 12px 4px;
  font-weight: 700;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 12px;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
  transition: background 0.15s;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link.ativo { background: var(--primary-soft); color: var(--primary-strong); }
.nav-icone { width: 22px; text-align: center; }
.sidebar-rodape { margin-top: auto; }

.main {
  flex: 1;
  min-width: 0;
  padding: 30px 36px 70px;
  max-width: 1280px;
  margin: 0 auto;
  outline: none;
}

.topbar { display: none; }
.sidebar-fundo { display: none; }

@media (max-width: 900px) {
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 58px;
    padding: 0 10px;
    padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    z-index: 30;
  }
  .topbar-marca { text-decoration: none; color: var(--text); font-family: 'Quicksand', sans-serif; font-size: 1.1rem; }
  .sidebar {
    position: fixed;
    left: 0; top: 0;
    z-index: 60;
    transform: translateX(-105%);
    transition: transform 0.25s ease;
    box-shadow: var(--sombra-forte);
  }
  .app.menu-aberto .sidebar { transform: none; }
  .app.menu-aberto .sidebar-fundo {
    display: block;
    position: fixed; inset: 0;
    background: rgba(30, 20, 50, 0.35);
    z-index: 55;
  }
  .main { padding: 76px 16px 60px; }
  h1 { font-size: 1.55rem; }
}

/* ---------- Cabeçalho de página ---------- */
.pagina-topo {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.pagina-topo p { margin-top: 6px; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.voltar { display: inline-block; margin-bottom: 10px; text-decoration: none; font-weight: 700; }

/* ---------- Cards e grids ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--sombra);
  min-width: 0;
}
.card-topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.card-topo h2 { display: flex; align-items: center; gap: 8px; }
.secao { margin-top: 22px; }
.secao-titulo { margin: 28px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.grid-cards-p { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.pilha { display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 1050px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Hero ---------- */
.hero {
  background: var(--hero);
  border: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 28px 30px;
  flex-wrap: wrap;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  width: 280px; height: 280px;
  right: -80px; top: -120px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%);
  pointer-events: none;
}
.hero-texto { flex: 1 1 320px; position: relative; z-index: 1; }
.hero-saudacao { color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.hero h1 { font-size: 2.3rem; }
.destaque { color: var(--primary); }
.palavra { margin-top: 10px; font-size: 1.05rem; }
.palavra strong { color: var(--primary-strong); }
blockquote {
  margin: 12px 0 0;
  padding: 10px 14px;
  border-left: 4px solid var(--accent);
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  border-radius: 0 12px 12px 0;
  font-style: italic;
  max-width: 620px;
}
.hero-ano { text-align: center; position: relative; z-index: 1; flex: 0 0 auto; margin: 0 auto; }
.hero-ano p { margin-top: 10px; }

.anel {
  --p: 0;
  --tam: 120px;
  width: var(--tam); height: var(--tam);
  border-radius: 50%;
  background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--surface-3) 0);
  display: grid; place-items: center;
  margin: 0 auto;
}
.anel span {
  width: calc(var(--tam) - 22px); height: calc(var(--tam) - 22px);
  border-radius: 50%;
  background: var(--surface);
  display: grid; place-items: center;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
}
.anel.mini { --tam: 64px; }
.anel.mini span { font-size: 0.95rem; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
.stats.cinco { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  box-shadow: var(--sombra);
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.stat-icone { font-size: 1.3rem; }
.stat-valor { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 1.6rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-rotulo { color: var(--muted); font-size: 0.86rem; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(0.97); }
.btn.primario { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 35%, transparent); }
.btn.primario:hover { background: var(--primary-strong); border-color: var(--primary-strong); }
.btn.suave { background: var(--primary-soft); border-color: transparent; color: var(--primary-strong); }
.btn.perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }
.btn.perigo-texto { color: var(--perigo); border-color: transparent; background: transparent; }
.btn.mini { padding: 5px 12px; font-size: 0.85rem; }
.btn.largo { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.icon-btn {
  border: none;
  background: transparent;
  width: 38px; height: 38px;
  border-radius: 12px;
  display: inline-grid; place-items: center;
  cursor: pointer;
  color: var(--muted);
  font-size: 1.05rem;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.mini { width: 28px; height: 28px; font-size: 0.85rem; border-radius: 9px; }
.link-btn { border: none; background: none; padding: 0; cursor: pointer; color: inherit; font-weight: 700; text-align: left; }
.link-btn:hover { color: var(--primary-strong); }

:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: 2px; }

/* ---------- Chips, tabs, filtros ---------- */
.chip {
  --cor: var(--primary-soft);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  background: color-mix(in srgb, var(--cor) 38%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--cor) 70%, transparent);
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tabs {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface-2);
  border-radius: 999px;
  border: 1px solid var(--border);
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.tab {
  border: none;
  background: transparent;
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
  color: var(--muted);
}
.tab.ativo { background: var(--surface); color: var(--primary-strong); box-shadow: var(--sombra); }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.filtro {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  color: var(--muted);
}
.filtro.ativo { background: var(--primary-soft); color: var(--primary-strong); border-color: var(--primary); }

/* ---------- Barras ---------- */
.barra {
  height: 10px;
  background: var(--surface-3);
  border-radius: 999px;
  overflow: hidden;
}
.barra > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.4s ease;
}
.barra.fina { height: 6px; }
.barra.cor > span { background: color-mix(in srgb, var(--cor) 85%, var(--primary)); }
.barra.excedeu > span { background: var(--perigo); }

/* ---------- Listas com check ---------- */
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lista > li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 12px;
  background: var(--surface-2);
  min-width: 0;
}
.lista > li.feito .check span { text-decoration: line-through; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; min-width: 0; }
.check span { overflow-wrap: anywhere; }
.check input, input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 22px; height: 22px;
  flex-shrink: 0;
  border-radius: 7px;
  border: 2px solid var(--primary);
  background: var(--surface);
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  margin: 0;
}
input[type="checkbox"]:checked { background: var(--primary); }
input[type="checkbox"]:checked::after { content: '✓'; color: var(--on-primary); font-size: 14px; font-weight: 800; line-height: 1; }

.linha-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
  min-width: 0;
}
.linha-item:last-child { border-bottom: none; }
.linha-item .cresce { flex: 1; min-width: 0; }
.linha-item .cresce > * + * { margin-top: 4px; }
.truncar { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.inline-form { display: flex; gap: 8px; margin-top: 12px; }
.inline-form input { flex: 1; min-width: 0; }

.vazio {
  text-align: center;
  padding: 26px 16px;
  color: var(--muted);
  border: 2px dashed var(--border);
  border-radius: 16px;
}
.vazio-icone { font-size: 2rem; display: block; margin-bottom: 6px; }
.vazio .btn { margin-top: 12px; }

/* ---------- Formulários ---------- */
input[type="text"], input[type="number"], input[type="date"], input[type="month"], input[type="email"], input:not([type]), select, textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  min-width: 0;
}
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > span { font-weight: 700; font-size: 0.88rem; }
.campo small { color: var(--muted); }
.campo.full, .form-acoes { grid-column: 1 / -1; }
.campo.check-campo { flex-direction: row; align-items: center; gap: 10px; }
@media (max-width: 560px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.form-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.foto-preview { max-height: 160px; border-radius: 12px; object-fit: cover; margin-top: 6px; }

.escolha { display: flex; gap: 6px; flex-wrap: wrap; }
.escolha label { cursor: pointer; }
.escolha input { position: absolute; opacity: 0; pointer-events: none; }
.escolha span {
  display: inline-grid; place-items: center;
  min-width: 44px; height: 44px;
  padding: 0 8px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: 1.3rem;
  transition: transform 0.1s;
}
.escolha input:checked + span { background: var(--primary-soft); border-color: var(--primary); transform: scale(1.06); }
.escolha input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--primary) 55%, transparent); }
.escolha.estrelas span { font-size: 1.1rem; color: var(--muted); }
.estrelas-txt { color: #e7a93b; letter-spacing: 1px; }

/* ---------- Modal ---------- */
#modais:empty { display: none; }
.modal-fundo {
  position: fixed; inset: 0;
  background: rgba(35, 22, 60, 0.42);
  backdrop-filter: blur(3px);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 100;
  animation: aparecer 0.15s ease;
}
.modal {
  background: var(--surface);
  border-radius: 24px;
  width: min(620px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  box-shadow: var(--sombra-forte);
  border: 1px solid var(--border);
  animation: subir 0.2s ease;
}
.modal-topo {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 6px;
  position: sticky; top: 0;
  background: var(--surface);
  z-index: 1;
}
.modal-corpo { padding: 10px 20px 20px; }
@keyframes aparecer { from { opacity: 0; } }
@keyframes subir { from { transform: translateY(14px); opacity: 0; } }

/* ---------- Toast ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translate(-50%, 140%);
  background: var(--text);
  color: var(--bg);
  padding: 12px 18px;
  border-radius: 16px;
  font-weight: 700;
  box-shadow: var(--sombra-forte);
  z-index: 200;
  display: flex;
  gap: 12px;
  align-items: center;
  transition: transform 0.25s ease, opacity 0.25s ease, visibility 0.25s;

function ehObjeto(v) { return v && typeof v === 'object' && !Array.isArray(v); }
function mesclarPadrao(base, obj) {
  if (!ehObjeto(obj)) return base;
  for (const k of Object.keys(base)) {
    if (obj[k] === undefined) obj[k] = base[k];
    else if (ehObjeto(base[k]) && ehObjeto(obj[k]) && Object.keys(base[k]).length) mesclarPadrao(base[k], obj[k]);
  }
  return obj;
}

function area(id) {

function notaAtual(a) {
  const ks = Object.keys(a.notas || {}).filter((k) => Number(a.notas[k]) > 0).sort();
  return ks.length ? Number(a.notas[ks[ks.length - 1]]) : 0;
}
function notaPartida(a) { return Number(a.notas?.[PARTIDA]) || 0; }

function progressoMeta(m) {
  if (m.tipo === 'numerica') return pct(m.atual, m.alvo);
  if (m.tipo === 'etapas') {
    const t = (m.etapas || []).length;
    return t ? Math.round((m.etapas.filter((e) => e.feito).length / t) * 100) : 0;
  }
  return m.concluida ? 100 : 0;
}
function mediaProgresso(metas) {
  return metas.length ? Math.round(metas.reduce((s, m) => s + progressoMeta(m), 0) / metas.length) : 0;
}

function sequenciaAtual(h) {
  let d = new Date();
  let n = 0;
  if (!h.registros[dataISO(d)]) d = addDias(d, -1);
  while (h.registros[dataISO(d)]) { n++; d = addDias(d, -1); }
  return n;
}
function melhorSequencia(h, soAno = false) {
  const dias = Object.keys(h.registros).filter((k) => h.registros[k] && (!soAno || doAno(k))).sort();
  let melhor = 0, atual = 0, anterior = null;
  for (const k of dias) {
    const d = lerISO(k);
    atual = anterior && Math.round((d - anterior) / 864e5) === 1 ? atual + 1 : 1;
    melhor = Math.max(melhor, atual);
    anterior = d;
  }
  return melhor;
}
function feitosNaSemana(h, ref = new Date()) {
  const ini = inicioSemana(ref);
  let n = 0;
  for (let i = 0; i < 7; i++) if (h.registros[dataISO(addDias(ini, i))]) n++;
  return n;
}

function comprimirImagem(arquivo, max = 1000, qualidade = 0.78) {
  return new Promise((resolver, rejeitar) => {
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolver(c.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = rejeitar;
      img.src = leitor.result;
    };
    leitor.onerror = rejeitar;
    leitor.readAsDataURL(arquivo);
  });
}

   Componentes de interface: toast, modais, formulários, gráficos

/* ---------- Toast ---------- */
function toast(msg, acao) {
  const t = $('#toast');
  t.innerHTML = `<span>${msg}</span>${acao ? `<button type="button" class="btn mini">${esc(acao.texto)}</button>` : ''}`;
  if (acao) t.querySelector('button').onclick = () => { t.classList.remove('visivel'); acao.fn(); };
  t.classList.add('visivel');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('visivel'), acao ? 7000 : 2800);
}

/* ---------- Modais (empilháveis) ---------- */
function abrirModal(titulo, corpoHTML) {
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo.replace(/<[^>]+>/g, ''))}">
      <header class="modal-topo">
        <h2>${titulo}</h2>
        <button type="button" class="icon-btn" data-fechar aria-label="Fechar">✕</button>
      </header>
      <div class="modal-corpo">${corpoHTML}</div>
    </div>`;
  fundo.addEventListener('mousedown', (e) => { fundo._clicouFora = e.target === fundo; });
  fundo.addEventListener('click', (e) => {
    if ((e.target === fundo && fundo._clicouFora) || e.target.closest('[data-fechar]')) fecharModal(fundo);
  });
  $('#modais').appendChild(fundo);
  document.body.classList.add('com-modal');
  setTimeout(() => {
    const f = fundo.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select');
    if (f && window.matchMedia('(min-width: 700px)').matches) f.focus();
  }, 40);
  return fundo;
}
function fecharModal(fundo) {
  fundo = fundo || $('#modais').lastElementChild;
  if (fundo) {
    if (fundo._aoFechar) fundo._aoFechar();
    fundo.remove();
  }
  if (!$('#modais').children.length) document.body.classList.remove('com-modal');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modais').children.length) fecharModal();
});

function confirmar(msg, { botao = 'Confirmar', perigo = true, titulo = 'Tem certeza?' } = {}) {
  return new Promise((resolver) => {
    let respondido = false;
    const f = abrirModal(titulo, `
      <p>${msg}</p>
      <div class="form-acoes" style="margin-top:18px">
        <span class="espaco"></span>
        <button type="button" class="btn" data-r="0">Cancelar</button>
        <button type="button" class="btn ${perigo ? 'perigo' : 'primario'}" data-r="1">${botao}</button>
      </div>`);
    f._aoFechar = () => { if (!respondido) { respondido = true; resolver(false); } };
    f.addEventListener('click', (e) => {
      const b = e.target.closest('[data-r]');
      if (!b) return;
      respondido = true;
      resolver(b.dataset.r === '1');
      fecharModal(f);
    });
  });
}

/* ---------- Formulários ---------- */
function opcoesArea(opcional) {
  const ops = D.areas.map((a) => ({ value: a.id, label: `${a.icone} ${a.nome}` }));
  return opcional ? [{ value: '', label: '🌱 Geral' }, ...ops] : ops;
}

function campoHTML(c, valor) {
  const v = valor ?? c.padrao ?? '';
  const id = 'c_' + c.name;
  const req = c.required ? 'required' : '';
  const ph = c.placeholder ? `placeholder="${esc(c.placeholder)}"` : '';
  let input;
  switch (c.type) {
    case 'textarea':
      input = `<textarea id="${id}" name="${c.name}" rows="${c.rows || 3}" ${ph} ${req} maxlength="${c.maxlength || 4000}">${esc(v)}</textarea>`;
      break;
    case 'select':
    case 'area': {
      const ops = c.type === 'area' ? opcoesArea(c.opcional) : c.options;
      input = `<select id="${id}" name="${c.name}" ${req}>${ops.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      break;
    }
    case 'checkbox':
      return `<label class="campo check-campo ${c.full ? 'full' : ''}" data-campo="${c.name}"><input type="checkbox" name="${c.name}" ${v ? 'checked' : ''}><span>${c.label}</span></label>`;
    case 'humor':
      input = `<div class="escolha" role="radiogroup">${HUMORES.map((h) => `<label title="${h.t}"><input type="radio" name="${c.name}" value="${h.v}" ${Number(v) === h.v ? 'checked' : ''}><span>${h.e}</span></label>`).join('')}</div>`;
      break;
    case 'estrelas':
      input = `<div class="escolha estrelas" role="radiogroup">${[1, 2, 3, 4, 5].map((n) => `<label title="${n} estrela(s)"><input type="radio" name="${c.name}" value="${n}" ${Number(v) === n ? 'checked' : ''}><span>${'★'.repeat(n)}</span></label>`).join('')}</div>`;
      break;
    case 'imagem':
      input = `
        <input type="file" id="${id}" name="${c.name}" accept="image/*">
        <input type="hidden" name="${c.name}_atual" value="${esc(v)}">
        <img class="foto-preview" data-preview="${c.name}" src="${esc(v)}" alt="" ${v ? '' : 'hidden'}>
        ${v ? `<label class="check" style="margin-top:6px"><input type="checkbox" name="${c.name}_remover"><span>Remover foto</span></label>` : ''}`;
      break;
    default:
      input = `<input type="${c.type || 'text'}" id="${id}" name="${c.name}" value="${esc(v)}" ${ph} ${req}
        ${c.min !== undefined ? `min="${c.min}"` : ''} ${c.max !== undefined ? `max="${c.max}"` : ''}
        ${c.step ? `step="${c.step}"` : ''} maxlength="${c.maxlength || 300}" ${c.type === 'number' ? 'inputmode="decimal"' : ''}>`;
  }
  return `<label class="campo ${c.full ? 'full' : ''}" data-campo="${c.name}" ${c.type === 'humor' || c.type === 'estrelas' ? 'role="group"' : ''}>
    <span>${c.label}</span>${input}${c.dica ? `<small>${c.dica}</small>` : ''}</label>`;
}

async function coletar(form, campos) {
  const out = {};
  for (const c of campos) {
    const el = form.elements[c.name];
    if (c.type === 'checkbox') out[c.name] = !!(el && el.checked);
    else if (c.type === 'number') out[c.name] = el.value === '' ? null : Number(el.value);
    else if (c.type === 'humor' || c.type === 'estrelas') {
      const r = form.querySelector(`input[name="${c.name}"]:checked`);
      out[c.name] = r ? Number(r.value) : null;
    } else if (c.type === 'imagem') {
      const arquivo = el.files && el.files[0];
      const remover = form.elements[c.name + '_remover'];
      if (arquivo) {
        try { out[c.name] = await comprimirImagem(arquivo); }
        catch { toast('Não consegui ler essa imagem 😕'); out[c.name] = form.elements[c.name + '_atual'].value; }
      } else if (remover && remover.checked) out[c.name] = '';
      else out[c.name] = form.elements[c.name + '_atual'].value;
    } else out[c.name] = (el.value || '').trim();
  }
  return out;
}

/**
 * Abre um formulário em modal.
 * campos: [{ name, label, type, required, full, options, mostrarSe:{campo, valores} }]
 * aoSalvar(dados) -> retorne false para manter o modal aberto
 */
function formModal({ titulo, campos, valores = {}, aoSalvar, aoExcluir, botao = 'Salvar', intro = '' }) {
  const corpo = `
    ${intro ? `<p class="muted" style="margin-bottom:14px">${intro}</p>` : ''}
    <form class="form-grid">
      ${campos.map((c) => campoHTML(c, valores[c.name])).join('')}
      <div class="form-acoes">
        ${aoExcluir ? '<button type="button" class="btn perigo-texto" data-excluir>🗑 Excluir</button>' : ''}
        <span class="espaco"></span>
        <button type="button" class="btn" data-fechar>Cancelar</button>
        <button type="submit" class="btn primario">${botao}</button>
      </div>
    </form>`;
  const fundo = abrirModal(titulo, corpo);
  const form = fundo.querySelector('form');

  const atualizarVisiveis = () => {
    campos.forEach((c) => {
      if (!c.mostrarSe) return;
      const el = form.querySelector(`[data-campo="${c.name}"]`);
      const ctrl = form.elements[c.mostrarSe.campo];
      const atual = ctrl && ctrl.type === 'checkbox' ? (ctrl.checked ? 'on' : '') : ctrl?.value;
      el.hidden = !c.mostrarSe.valores.includes(atual);
    });
  };
  form.addEventListener('change', (e) => {
    atualizarVisiveis();
    if (e.target.type === 'file' && e.target.files[0]) {
      const prev = form.querySelector(`[data-preview="${e.target.name}"]`);
      if (prev) { prev.src = URL.createObjectURL(e.target.files[0]); prev.hidden = false; }
    }
  });
  atualizarVisiveis();

  let enviando = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (enviando) return;
    enviando = true;
    try {
      const dados = await coletar(form, campos);
      if (aoSalvar(dados) === false) return;
      salvar();
      fecharModal(fundo);
      renderizar();
    } finally { enviando = false; }
  });

  if (aoExcluir) {
    fundo.querySelector('[data-excluir]').addEventListener('click', async () => {
      if (await confirmar('Esse item será excluído permanentemente.', { botao: 'Excluir' })) {
        aoExcluir();
        salvar();
        fecharModal(fundo);
        renderizar();
        toast('Excluído');
      }
    });
  }
  return fundo;
}

/* ---------- Gráficos ---------- */
function radarSVG(series, tam = 360) {
  const as = D.areas;
  const n = as.length;
  const c = tam / 2;
  const r = c - 62;
  const ponto = (i, v) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    return [c + Math.cos(ang) * (r * v) / 10, c + Math.sin(ang) * (r * v) / 10];
  };
  let s = `<svg class="radar" viewBox="0 0 ${tam} ${tam}" role="img" aria-label="Roda da vida">`;
  for (const k of [2, 4, 6, 8, 10]) {
    s += `<polygon class="radar-anel" points="${as.map((_, i) => ponto(i, k).map((x) => x.toFixed(1)).join(',')).join(' ')}"/>`;
  }
  as.forEach((_, i) => {
    const [x, y] = ponto(i, 10);
    s += `<line class="radar-eixo" x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  });
  series.forEach((se) => {
    const vals = as.map((a) => se.valor(a) || 0);
    if (!vals.some(Boolean)) return;
    s += `<polygon class="radar-serie ${se.classe}" points="${vals.map((v, i) => ponto(i, v).map((x) => x.toFixed(1)).join(',')).join(' ')}"/>`;
    vals.forEach((v, i) => {
      if (!v) return;
      const [x, y] = ponto(i, v);
      s += `<circle class="radar-ponto ${se.classe}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"><title>${esc(as[i].nome)}: ${v}</title></circle>`;
    });
  });
  const principal = series[series.length - 1];
  as.forEach((a, i) => {
    const [x, y] = ponto(i, 12.9);
    const v = principal.valor(a);
    s += `<g><title>${esc(a.nome)}</title><text x="${x.toFixed(1)}" y="${(y - 3).toFixed(1)}" text-anchor="middle" class="radar-icone">${a.icone}</text>
      <text x="${x.toFixed(1)}" y="${(y + 14).toFixed(1)}" text-anchor="middle" class="radar-valor">${v || '–'}</text></g>`;
  });
  return s + '</svg>';
}

function legendaRadar() {
  return `<div class="legenda"><span><i style="background:var(--accent)"></i>Ponto de partida</span><span><i style="background:var(--primary)"></i>Nota mais recente</span></div>`;
}

function sparkline(pontos, { max = 10 } = {}) {
  // pontos: [{rotulo, valor}]
  const w = 320, h = 80, pad = 12;
  const passo = (w - pad * 2) / Math.max(1, pontos.length - 1);
  const y = (v) => h - 16 - ((h - 26) * v) / max;
  const validos = pontos.map((p, i) => ({ ...p, x: pad + i * passo })).filter((p) => p.valor);
  let s = `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Evolução das notas">`;
  s += `<line class="linha-base" x1="${pad}" x2="${w - pad}" y1="${y(5)}" y2="${y(5)}"/>`;
  if (validos.length > 1) s += `<polyline points="${validos.map((p) => `${p.x.toFixed(1)},${y(p.valor).toFixed(1)}`).join(' ')}"/>`;
  validos.forEach((p) => { s += `<circle cx="${p.x.toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="3.5"><title>${p.rotulo}: ${p.valor}</title></circle>`; });
  pontos.forEach((p, i) => { if (i % 2 === 0) s += `<text x="${(pad + i * passo).toFixed(1)}" y="${h - 2}" text-anchor="middle">${p.rotulo}</text>`; });
  return s + '</svg>';
}

  let controle = '';
  if (m.tipo === 'numerica') {
    const fmt = m.unidade === 'R$' ? fmtDinheiro : fmtNum;
    const u = m.unidade && m.unidade !== 'R$' ? ` ${esc(m.unidade)}` : '';
    controle = `<div class="contador">
      <button type="button" class="icon-btn" data-acao="metaMenos" data-id="${m.id}" aria-label="Diminuir">−</button>

      <button type="button" class="icon-btn" data-acao="metaMais" data-id="${m.id}" aria-label="Aumentar">+</button>
    </div>`;
  } else if (m.tipo === 'etapas') {
    controle = `<ul class="etapas">${m.etapas.map((e) => `<li class="${e.feito ? 'feito' : ''}"><label class="check"><input type="checkbox" data-mudar="etapa" data-meta="${m.id}" data-etapa="${e.id}" ${e.feito ? 'checked' : ''}><span>${esc(e.texto)}</span></label></li>`).join('')}</ul>`;

    controle = `<label class="check"><input type="checkbox" data-mudar="metaSimples" data-id="${m.id}" ${m.concluida ? 'checked' : ''}><span>Concluída</span></label>`;
  }
  return `<article class="card meta ${p >= 100 ? 'concluida' : ''}" style="--cor:${a.cor}">
    <div class="meta-topo">${chipArea(a)}<button type="button" class="icon-btn mini" data-acao="editarMeta" data-id="${m.id}" aria-label="Editar meta">✎</button></div>

    ${barra(p, a.cor)}

    ${objs.length ? `<p class="muted pequeno">🗓️ ${objs.filter((o) => o.feito).length}/${objs.length} objetivos trimestrais</p>` : ''}

      <div class="dica">💡 Quebre cada meta anual em objetivos menores por trimestre. Assim o ano fica com 4 “mini-anos” e é mais fácil ajustar a rota.</div>
      <section class="trimestres">
        ${[1, 2, 3, 4].map((t) => {
          const objs = D.objetivos.filter((o) => o.trimestre === t);
          const feitos = objs.filter((o) => o.feito).length;
          return `<div class="card trimestre ${t === atual ? 'atual' : ''}">
            <div class="card-topo"><h2>${t}º tri <small>${nomes[t]}</small></h2><span class="muted pequeno">${feitos}/${objs.length}</span></div>
            ${barra(pct(feitos, objs.length))}
            <ul class="lista" style="margin-top:12px">${objs.map(itemObjetivo).join('')}</ul>
            <button class="btn mini suave largo" style="margin-top:12px" data-acao="novoObjetivo" data-tri="${t}">+ Objetivo</button>
          </div>`;
        }).join('')}
      </section>`;
  }
  return `
    ${cabecalho('🎯 Metas e objetivos', 'Metas para o ano, divididas em objetivos trimestrais.',
      aba === 'ano' ? '<button class="btn primario" data-acao="novaMeta">+ Nova meta</button>' : '<button class="btn primario" data-acao="novoObjetivo">+ Novo objetivo</button>')}
    ${abas('metasAba', [['ano', '📅 Metas do ano'], ['tri', '🗓️ Trimestres']])}
    ${corpo}`;
};

/* ================= Hábitos ================= */
VIEWS.habitos = () => {
  const agora = new Date();
  if (!estado.habMes) estado.habMes = { ano: agora.getFullYear(), mes: agora.getMonth() };
  const { ano, mes } = estado.habMes;
  const nd = diasNoMes(ano, mes);
  const hoje = hojeISO();
  const dias = Array.from({ length: nd }, (_, i) => {
    const d = new Date(ano, mes, i + 1);
    return { iso: dataISO(d), n: i + 1, dow: d.getDay() };
  });
  const decorridos = dias.filter((d) => d.iso <= hoje).length;

  const tabela = D.habitos.length ? `
    <div class="card"><div class="rolagem-x">
      <table class="hab-tabela">
        <thead><tr><th class="hab-nome">Hábito</th>
          ${dias.map((d) => `<th class="${d.dow === 0 || d.dow === 6 ? 'fds' : ''} ${d.iso === hoje ? 'hoje-col' : ''}">${DIAS_C[d.dow]}<br>${d.n}</th>`).join('')}
          <th>%</th></tr></thead>
        <tbody>
          ${D.habitos.map((h) => {
            const a = area(h.areaId);
            const feitosMes = dias.filter((d) => h.registros[d.iso]).length;
            const seq = sequenciaAtual(h);
            return `<tr>
              <td class="hab-nome"><button class="link-btn" data-acao="editarHabito" data-id="${h.id}">${esc(h.icone || '')} ${esc(h.nome)}</button>
                <small>${seq ? `🔥 ${seq}` : '·'} · ${feitosNaSemana(h)}/${h.metaSemanal || 7} na semana</small></td>
              ${dias.map((d) => {
                const on = !!h.registros[d.iso];
                return `<td><button type="button" class="hab-cel ${on ? 'on' : ''} ${d.iso === hoje ? 'hoje' : ''}" style="--cor:${a.cor}" data-acao="toggleHabito" data-id="${h.id}" data-dia="${d.iso}" ${d.iso > hoje ? 'disabled' : ''} aria-pressed="${on}" aria-label="${esc(h.nome)} em ${d.n}/${mes + 1}"></button></td>`;
              }).join('')}
              <td class="hab-pct">${decorridos ? pct(feitosMes, decorridos) : 0}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div></div>` : vazio('🔁', 'Nenhum hábito ainda. Comece com 2 ou 3, pequenos e fáceis.', '<button class="btn primario" data-acao="novoHabito">+ Criar hábito</button>');

  const resumo = D.habitos.length ? `
    <h2 class="secao-titulo">📊 Resumo de ${ANO}</h2>
    <section class="grid-cards-p">
      ${D.habitos.map((h) => {
        const a = area(h.areaId);
        const totalAno = Object.keys(h.registros).filter((k) => h.registros[k] && doAno(k)).length;
        return `<div class="card" style="--cor:${a.cor}">
          <div class="meta-topo"><strong class="truncar">${esc(h.icone || '')} ${esc(h.nome)}</strong></div>
          <p class="muted pequeno" style="margin-top:6px">${chipArea(a)}</p>
          <div class="grid-2" style="gap:8px;margin-top:10px;grid-template-columns:1fr 1fr">
            <div><div class="stat-valor" style="font-size:1.3rem">${totalAno}</div><div class="muted pequeno">dias em ${ANO}</div></div>
            <div><div class="stat-valor" style="font-size:1.3rem">${melhorSequencia(h)}</div><div class="muted pequeno">melhor sequência</div></div>
          </div>
        </div>`;
      }).join('')}
    </section>` : '';

  return `
    ${cabecalho('🔁 Hábitos', 'Pequenas ações repetidas constroem o ano. Toque nos quadradinhos para marcar.', '<button class="btn primario" data-acao="novoHabito">+ Novo hábito</button>')}
    <div class="secao-titulo" style="margin-top:0">
      <div class="mes-nav">
        <button class="icon-btn mini" data-acao="habMes" data-delta="-1" aria-label="Mês anterior">‹</button>
        <strong>${MESES[mes]} ${ano}</strong>
        <button class="icon-btn mini" data-acao="habMes" data-delta="1" aria-label="Próximo mês">›</button>
      </div>
      <button class="btn mini" data-acao="habMes" data-delta="0">Hoje</button>
    </div>
    ${tabela}
    ${resumo}`;
};

/* ================= Feitos ================= */

  const a = area(f.areaId);
  return `<article class="card feito-card" style="--cor:${a.cor}">
    ${f.foto ? `<img src="${f.foto}" alt="${esc(f.titulo)}" loading="lazy">` : ''}
    <div class="feito-corpo">
      <span class="feito-data">${fmtData(f.data, { day: '2-digit', month: 'long', year: 'numeric' })}</span>

    </div>
  </article>`;
}

  const f = estado.feitosFiltro;
  const lista = D.feitos.filter((x) => f === 'todas' || x.areaId === f).sort((a, b) => b.data.localeCompare(a.data));
  const grupos = {};
  lista.forEach((x) => { const k = x.data.slice(0, 7); (grupos[k] = grupos[k] || []).push(x); });
  const doAnoQtd = D.feitos.filter((x) => doAno(x.data)).length;

  return `
    ${cabecalho('🏆 Mural de feitos', `Tudo o que você conquistou, viveu e celebrou. ${doAnoQtd} ${doAnoQtd === 1 ? 'feito' : 'feitos'} em ${ANO} até agora.`, '<button class="btn primario" data-acao="novoFeito">+ Registrar feito</button>')}

    ${lista.length ? Object.keys(grupos).sort().reverse().map((k) => {
      const [y, m] = k.split('-').map(Number);
      return `<section class="timeline-mes"><h2>${MESES[m - 1]} ${y} <span class="chip">${grupos[k].length}</span></h2>
        <div class="grid-cards">${grupos[k].map(cardFeito).join('')}</div></section>`;
    }).join('') : vazio('🏆', 'Nenhum feito por aqui ainda. Vale tudo: terminar um livro, uma conversa difícil, um treino, uma viagem.', '<button class="btn primario" data-acao="novoFeito">+ Registrar o primeiro</button>')}`;
};

/* ================= Retrospectiva ================= */

  const feitos = D.feitos.filter((f) => doAno(f.data));
  const metasOk = D.metas.filter((m) => progressoMeta(m) >= 100);
  const livros = D.listas.livros.filter((l) => l.status === 'concluido' && doAno(l.data));
  const filmes = D.listas.filmes.filter((l) => l.status === 'concluido' && doAno(l.data));
  const viagens = D.listas.viagens.filter((l) => l.status === 'concluido' && doAno(l.data));
  const desejos = D.desejos.filter((d) => d.feito && doAno(d.dataFeito));
  const diario = D.diario.filter((d) => doAno(d.data));
  const guardado = soma(D.financas.caixinhas, 'atual');
  const melhorHab = D.habitos.map((h) => ({ h, s: melhorSequencia(h, true) })).sort((a, b) => b.s - a.s)[0];
  const diasHabitos = D.habitos.reduce((s, h) => s + Object.keys(h.registros).filter((k) => h.registros[k] && doAno(k)).length, 0);
  const porArea = D.areas.map((a) => ({ a, n: feitos.filter((f) => f.areaId === a.id).length }));
  const maxArea = Math.max(1, ...porArea.map((x) => x.n));
  const humorMes = MESES_C.map((m, i) => {
    const es = diario.filter((d) => d.data.slice(5, 7) === String(i + 1).padStart(2, '0') && d.humor);
    return { m, v: es.length ? soma(es, 'humor') / es.length : 0 };
  });
  const fotos = feitos.filter((f) => f.foto).slice(0, 12);
  const pa = progressoAno();

  return `
    <section class="card hero retro-hero" style="display:block">
      <p class="hero-saudacao">${pa.depois ? 'Que ano!' : pa.antes ? 'Uma prévia do que vem por aí' : `Até agora, ${pa.pct}% do ano já foi vivido`}</p>
      <h1>Retrospectiva <span class="destaque">${ANO}</span></h1>
      ${D.config.palavra ? `<p class="palavra">A palavra do ano foi <strong>${esc(D.config.palavra)}</strong></p>` : ''}
      ${D.config.nome ? `<p class="muted" style="margin-top:6px">de ${esc(D.config.nome)}</p>` : ''}
    </section>

    <section class="stats cinco">
      ${stat('🏆', feitos.length, 'feitos registrados')}
      ${stat('🎯', `${metasOk.length}/${D.metas.length}`, 'metas concluídas')}
      ${stat('🔁', diasHabitos, 'check-ins de hábitos')}
      ${stat('🔥', melhorHab ? melhorHab.s : 0, melhorHab ? `melhor sequência (${esc(melhorHab.h.nome)})` : 'melhor sequência')}
      ${stat('📚', livros.length, 'livros lidos')}
      ${stat('🎬', filmes.length, 'filmes e séries')}
      ${stat('✈️', viagens.length, 'viagens realizadas')}
      ${stat('🌈', desejos.length, 'sonhos realizados')}
      ${stat('💰', fmtDinheiro(guardado), 'guardado nas caixinhas')}
      ${stat('📔', diario.length, 'páginas de diário')}
    </section>

    <section class="grid-2">
      <div class="card centro">
        <h2 style="margin-bottom:8px">🌸 Como a roda da vida mudou</h2>
        ${radarSVG([{ classe: 'partida', valor: notaPartida }, { classe: 'atual', valor: notaAtual }])}
        ${legendaRadar()}
      </div>
      <div class="card">
        <h2 style="margin-bottom:14px">🏆 Feitos por área</h2>
        <div class="barras-h">${porArea.map(({ a, n }) => `<div class="linha"><span class="truncar">${a.icone} ${esc(a.nome)}</span><strong class="num">${n}</strong>${barra((n / maxArea) * 100, a.cor)}</div>`).join('')}</div>
      </div>
    </section>

    ${diario.length ? `<section class="card secao"><h2>📔 Humor médio por mês</h2>
      <div class="barras-v">${humorMes.map((x) => `<div class="col"><div class="par"><div class="b unica" style="height:${(x.v / 5) * 100}%" title="${x.v ? x.v.toFixed(1) : 'sem registros'}"></div></div><small>${x.m}</small></div>`).join('')}</div></section>` : ''}

    <section class="grid-2 secao">
      <div class="card">
        <h2 style="margin-bottom:12px">🎯 Metas do ano</h2>
        ${D.metas.length ? D.metas.map((m) => {
          const a = area(m.areaId), p = progressoMeta(m);
          return `<div class="linha-item"><span>${p >= 100 ? '✅' : a.icone}</span><div class="cresce"><div class="meta-prog"><strong class="truncar" style="color:var(--text)">${esc(m.titulo)}</strong><span>${p}%</span></div>${barra(p, a.cor)}</div></div>`;
        }).join('') : '<p class="muted">Nenhuma meta cadastrada.</p>'}
      </div>
      <div class="card">
        <h2 style="margin-bottom:12px">✨ Momentos marcantes</h2>
        ${feitos.length ? [...feitos].sort((a, b) => a.data.localeCompare(b.data)).slice(-10).reverse().map((f) => `<div class="linha-item"><span>${area(f.areaId).icone}</span><div class="cresce"><strong>${esc(f.titulo)}</strong><div class="muted pequeno">${fmtData(f.data)}</div></div></div>`).join('') : '<p class="muted">Os feitos de 2027 aparecerão aqui.</p>'}
      </div>
    </section>

    ${fotos.length ? `<section class="card secao"><h2 style="margin-bottom:12px">📸 Álbum do ano</h2>
      <div class="galeria">${fotos.map((f) => `<figure><img src="${f.foto}" alt="${esc(f.titulo)}" loading="lazy"><figcaption>${esc(f.titulo)}</figcaption></figure>`).join('')}</div></section>` : ''}`;
};

/* ================= Finanças ================= */
VIEWS.financas = () => {
  if (!estado.finMes) estado.finMes = mesAtualAno();
  const m = estado.finMes;
  const k = mesKey(m);
  const F = D.financas;
  const lanc = F.lancamentos.filter((l) => l.mes === k);
  const receitas = lanc.filter((l) => l.tipo === 'receita');
  const despesas = lanc.filter((l) => l.tipo === 'despesa');
  const rec = soma(receitas), desp = soma(despesas), saldo = rec - desp;
  const taxa = rec > 0 ? Math.round((saldo / rec) * 100) : 0;

  const categorias = CATEGORIAS_DESPESA
    .map((c) => ({ c, v: soma(despesas.filter((l) => l.categoria === c)), lim: Number(F.limites[c]) || 0 }))
    .filter((x) => x.v || x.lim)
    .sort((a, b) => b.v - a.v);

  const anual = Array.from({ length: 12 }, (_, i) => {
    const ls = F.lancamentos.filter((l) => l.mes === mesKey(i + 1));
    return { r: soma(ls.filter((l) => l.tipo === 'receita')), d: soma(ls.filter((l) => l.tipo === 'despesa')) };
  });
  const maxAnual = Math.max(1, ...anual.map((x) => Math.max(x.r, x.d)));
  const totAnoR = soma(anual, 'r'), totAnoD = soma(anual, 'd');

  const linhaLanc = (l) => `<div class="linha-item">
    <span class="area-icone" style="--cor:${l.tipo === 'receita' ? '#9fd8b8' : '#f4adc8'};width:36px;height:36px;font-size:1rem;border-radius:11px">${l.tipo === 'receita' ? '↓' : '↑'}</span>
    <div class="cresce"><strong class="truncar" style="display:block">${esc(l.descricao || l.categoria)}</strong><span class="muted pequeno">${esc(l.categoria)}</span></div>
    <strong class="num" style="color:${l.tipo === 'receita' ? 'var(--ok)' : 'var(--text)'}">${l.tipo === 'receita' ? '+' : '−'} ${fmtDinheiro(l.valor)}</strong>
    <button class="icon-btn mini" data-acao="editarLancamento" data-id="${l.id}" aria-label="Editar lançamento">✎</button>
  </div>`;

  return `
    ${cabecalho('💸 Finanças', 'Orçamento mensal simples e caixinhas para seus objetivos.', '<button class="btn" data-acao="editarLimites">⚙️ Limites</button><button class="btn primario" data-acao="novoLancamento">+ Lançamento</button>')}
    <div class="secao-titulo" style="margin-top:0">
      <div class="mes-nav">
        <button class="icon-btn mini" data-acao="finMes" data-delta="-1" aria-label="Mês anterior" ${m <= 1 ? 'disabled' : ''}>‹</button>
        <strong>${MESES[m - 1]} ${ANO}</strong>
        <button class="icon-btn mini" data-acao="finMes" data-delta="1" aria-label="Próximo mês" ${m >= 12 ? 'disabled' : ''}>›</button>
      </div>
    </div>
    <section class="stats">
      ${stat('💚', fmtDinheiro(rec), 'receitas do mês')}
      ${stat('🧾', fmtDinheiro(desp), 'despesas do mês')}
      ${stat(saldo >= 0 ? '✨' : '⚠️', fmtDinheiro(saldo), 'saldo do mês')}
      ${stat('🐷', `${taxa}%`, 'da renda poupada')}
    </section>

/* ================= Diário ================= */
VIEWS.diario = () => {
  const entradas = [...D.diario].sort((a, b) => b.data.localeCompare(a.data));
  const porDia = {};
  D.diario.forEach((e) => { if (e.humor) porDia[e.data] = e.humor; });
  const hoje = hojeISO();
  const doAnoQtd = D.diario.filter((e) => doAno(e.data)).length;

  const heat = MESES_C.map((m, i) => {
    const nd = diasNoMes(ANO, i);
    let s = `<span class="mes-rotulo">${m}</span>`;
    for (let d = 1; d <= 31; d++) {
      if (d > nd) { s += '<span class="dia vazio-dia"></span>'; continue; }
      const iso = dataISO(new Date(ANO, i, d));
      const h = porDia[iso];
      s += `<button type="button" class="dia ${h ? 'h' + h : ''}" data-acao="diarioDia" data-dia="${iso}" title="${fmtData(iso)}${h ? ' · ' + HUMORES[h - 1].t : ''}" aria-label="${fmtData(iso)}"></button>`;
    }
    return s;
  }).join('');

  return `
    ${cabecalho('📔 Diário', `Um espaço para registrar como você está. ${doAnoQtd} ${doAnoQtd === 1 ? 'registro' : 'registros'} em ${ANO}.`, '<button class="btn primario" data-acao="novoDiario">+ Escrever hoje</button>')}
    <section class="card">
      <div class="card-topo"><h2>🎨 Humor do ano</h2>
        <span class="legenda" style="margin:0">${HUMORES.map((h) => `<span title="${h.t}">${h.e}<i class="dia h${h.v}" style="display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 0 0 4px;vertical-align:middle"></i></span>`).join('')}</span>
      </div>
      <div class="rolagem-x"><div class="heatmap">${heat}</div></div>
      <p class="muted pequeno" style="margin-top:8px">Toque em um dia para escrever ou ver o registro.</p>
    </section>
    <h2 class="secao-titulo">✍️ Registros</h2>
    ${entradas.length ? `<div class="pilha">${entradas.map((e) => {
      const h = e.humor ? HUMORES[e.humor - 1] : null;
      return `<article class="card diario-entrada">
        <span class="diario-humor" title="${h ? h.t : ''}">${h ? h.e : '📝'}</span>
        <div class="cresce">
          <div class="meta-topo"><strong>${maiuscula(fmtDataLonga(e.data))}${e.data.slice(0, 4) !== String(new Date().getFullYear()) ? ` de ${e.data.slice(0, 4)}` : ''}</strong>
            <button class="icon-btn mini" data-acao="editarDiario" data-id="${e.id}" aria-label="Editar registro">✎</button></div>
          ${e.texto ? `<p>${esc(e.texto)}</p>` : ''}
          ${e.gratidao ? `<div class="gratidao">🙏 ${esc(e.gratidao)}</div>` : ''}
        </div>
      </article>`;
    }).join('')}</div>` : vazio('📔', 'Nenhum registro ainda. Como foi o seu dia?', `<button class="btn primario" data-acao="novoDiario" data-dia="${hoje}">Escrever agora</button>`)}`;
};

/* ---------- Tema ---------- */
const mqEscuro = window.matchMedia('(prefers-color-scheme: dark)');
function aplicarTema() {
  const html = document.documentElement;
  html.dataset.paleta = D.config.paleta === 'rosa' ? 'rosa' : 'lilas';
  const temaHost = html.dataset.theme; // definido por alguns visualizadores (claro/escuro)
  const autoEscuro = temaHost === 'dark' ? true : temaHost === 'light' ? false : mqEscuro.matches;
  const escuro = D.config.modo === 'escuro' || (D.config.modo === 'auto' && autoEscuro);
  html.dataset.escuro = escuro ? '1' : '0';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = escuro ? (html.dataset.paleta === 'rosa' ? '#211720' : '#1b1625') : (html.dataset.paleta === 'rosa' ? '#f3b6cd' : '#b39ae6');
}
mqEscuro.addEventListener?.('change', () => { if (D.config.modo === 'auto') aplicarTema(); });

/* ---------- Roteamento ---------- */
let rotaAnterior = null;
function renderizar() {
  // Rotas: #inicio, #metas, #area-saude (aceita também o formato antigo #/area/saude)
  const bruto = location.hash.replace(/^#\/?/, '');
  const partes = bruto.startsWith('area-') ? ['area', bruto.slice(5)] : bruto.split('/');
  const nome = VIEWS[partes[0]] ? partes[0] : 'inicio';
  const main = $('#main');
  try {
    main.innerHTML = VIEWS[nome](...partes.slice(1).map(decodeURIComponent));
  } catch (e) {
    console.error(e);
    main.innerHTML = vazio('😵', 'Algo deu errado ao mostrar esta página.', '<a class="btn" href="#inicio">Voltar ao início</a>');
  }
  const rotaNav = nome === 'area' ? 'areas' : nome;
  $$('.nav-link').forEach((a) => {
    const ativo = a.dataset.rota === rotaNav;
    a.classList.toggle('ativo', ativo);
    if (ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (location.hash !== rotaAnterior) {
    if (rotaAnterior !== null) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
    rotaAnterior = location.hash;
    $('#app').classList.remove('menu-aberto');
    const item = NAV.flatMap((g) => g.itens).find(([r]) => r === rotaNav);
    document.title = item && nome !== 'inicio' ? `${item[2]} · Meu Ano 2027` : 'Meu Ano 2027';
    if (nome === 'habitos') rolarParaHoje();
  }
}
window.addEventListener('hashchange', renderizar);

function rolarParaHoje() {
  const caixa = $('.rolagem-x');
  const col = $('.hab-tabela th.hoje-col');
  if (caixa && col) caixa.scrollLeft = Math.max(0, col.offsetLeft - caixa.clientWidth + 80);
}

function mudou() { salvar(); renderizar(); }

    { name: 'etapasTexto', label: 'Etapas (uma por linha)', type: 'textarea', full: true, rows: 5, placeholder: 'Pesquisar\nComeçar\nTerminar', mostrarSe: { campo: 'tipo', valores: ['etapas'] } },
  ];
  const valores = m ? { ...m, etapasTexto: (m.etapas || []).map((e) => e.texto).join('\n') } : {};
  formModal({
    titulo: m ? 'Editar meta' : '🎯 Nova meta',
    intro: m ? '' : 'Dica: metas boas são específicas e mensuráveis. “Ler 24 livros” é melhor que “ler mais”.',
    campos, valores,
    aoSalvar: (d) => {
      if (d.tipo === 'numerica' && !(d.alvo > 0)) { toast('Informe um valor alvo maior que zero'); return false; }
      const antes = m ? progressoMeta(m) : 0;
      const anteriores = m ? m.etapas || [] : [];
      const etapas = d.etapasTexto.split('\n').map((s) => s.trim()).filter(Boolean).map((t) => {
        const ex = anteriores.find((e) => e.texto === t);
        return { id: ex ? ex.id : uid(), texto: t, feito: ex ? ex.feito : false };
      });
      if (d.tipo === 'etapas' && !etapas.length) { toast('Adicione pelo menos uma etapa'); return false; }
      const obj = { titulo: d.titulo, areaId: d.areaId, prazo: d.prazo, descricao: d.descricao, tipo: d.tipo, unidade: d.unidade, atual: d.atual || 0, alvo: d.alvo || 0, passo: d.passo || 1, etapas };
      if (m) Object.assign(m, obj);
      else D.metas.push({ id: uid(), criadoEm: hojeISO(), concluida: false, ...obj });
      if (m) setTimeout(() => celebrarSeConcluiu(m, antes));
    },
    aoExcluir: m ? () => {
      D.metas = D.metas.filter((x) => x !== m);
      D.objetivos.forEach((o) => { if (o.metaId === m.id) o.metaId = ''; });
    } : null,
  });
}

function celebrarSeConcluiu(m, antes) {

      fn: () => {
        D.feitos.push({ id: uid(), titulo: `Concluí a meta: ${m.titulo}`, data: hojeISO(), areaId: m.areaId, descricao: m.descricao || '', foto: '' });

    D.areas.forEach((a) => { if (valores['nota_' + a.id] == null && a.notas[mesKey(mes)]) valores['nota_' + a.id] = a.notas[mesKey(mes)]; });
  }
  if (tipo === 'trimestral' && r) valores.trimestre = String(r.trimestre);

    campos, valores,

        d.mes = Number(d.mes);
        D.areas.forEach((a) => {
          const v = d['nota_' + a.id];

/* ---------- Backup ---------- */
function exportar() {
  D.config.ultimoBackup = hojeISO();
  salvar();
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `meuano2027-backup-${hojeISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  renderizar();
  mostrarBackupTexto();
}

// Alguns lugares (como o visualizador do Claude) bloqueiam downloads.
// Por isso o backup também aparece como texto para copiar e guardar.
function mostrarBackupTexto() {
  const texto = JSON.stringify(D);
  const f = abrirModal('💾 Seu backup', `
    <p class="muted" style="margin-bottom:12px">Se o arquivo não baixou, copie o texto abaixo e guarde em um lugar seguro (um e-mail para você mesmo, uma nota, o Google Drive…). Para restaurar, use <strong>Importar backup → Colar texto</strong>.</p>
    <textarea id="backup-texto" rows="8" readonly style="font-family:monospace;font-size:12px">${esc(texto)}</textarea>
    <div class="form-acoes" style="margin-top:12px"><span class="espaco"></span>
      <button type="button" class="btn" data-fechar>Fechar</button>
      <button type="button" class="btn primario" id="copiar-backup">📋 Copiar</button>
    </div>`);
  f.querySelector('#copiar-backup').addEventListener('click', () => {
    const ta = f.querySelector('#backup-texto');
    const ok = () => toast('📋 Backup copiado!');
    try {
      navigator.clipboard.writeText(texto).then(ok).catch(() => { ta.select(); toast('Texto selecionado: use Copiar do seu aparelho'); });
    } catch { ta.select(); toast('Texto selecionado: use Copiar do seu aparelho'); }
  });
}

async function restaurarDe(textoJSON) {
  try {
    const dados = JSON.parse(textoJSON);
    if (!dados || !Array.isArray(dados.areas) || !dados.config) throw new Error('formato');
    if (!(await confirmar('Importar este backup vai <strong>substituir</strong> todos os dados atuais deste navegador.', { botao: 'Importar' }))) return false;
    D = mesclarPadrao(dadosPadrao(), dados);
    D.config.boasVindas = true;
    salvar();
    aplicarTema();
    renderizar();
    toast('✅ Backup importado!');
    return true;
  } catch (e) {
    console.error(e);
    toast('⚠️ Backup inválido. Use um backup exportado por este site.');
    return false;
  }
}

function importar() {
  const f = abrirModal('⬆️ Importar backup', `
    <p class="muted" style="margin-bottom:12px">Escolha o arquivo .json do backup ou cole o texto copiado.</p>
    <div class="pilha" style="gap:12px">
      <label class="campo"><span>Arquivo de backup</span><input type="file" id="imp-arquivo" accept=".json,application/json"></label>
      <label class="campo"><span>Ou cole o texto aqui</span><textarea id="imp-texto" rows="5" style="font-family:monospace;font-size:12px"></textarea></label>
    </div>
    <div class="form-acoes" style="margin-top:12px"><span class="espaco"></span>
      <button type="button" class="btn" data-fechar>Cancelar</button>
      <button type="button" class="btn primario" id="imp-ok">Importar</button>
    </div>`);
  f.querySelector('#imp-ok').addEventListener('click', async () => {
    const arq = f.querySelector('#imp-arquivo').files[0];
    const texto = arq ? await arq.text() : f.querySelector('#imp-texto').value.trim();
    if (!texto) { toast('Escolha um arquivo ou cole o texto do backup'); return; }
    if (await restaurarDe(texto)) fecharModal(f);
  });
}

/* ---------- Ações (cliques) ---------- */
const achar = (lista, id) => lista.find((x) => x.id === id);

const ACOES = {
  menu: () => $('#app').classList.toggle('menu-aberto'),
  alternarModo: () => {
    const escuro = document.documentElement.dataset.escuro === '1';
    D.config.modo = escuro ? 'claro' : 'escuro';
    salvar(); aplicarTema();
    if (location.hash.includes('config')) renderizar();
  },
  estado: (ds) => { estado[ds.chave] = ds.valor; renderizar(); },
  irTrimestres: () => { estado.metasAba = 'tri'; location.hash = '#metas'; renderizar(); },

  novaMeta: (ds) => abrirMeta(null, ds.area),
  editarMeta: (ds) => abrirMeta(achar(D.metas, ds.id)),
  metaMais: (ds) => ajustarMeta(ds.id, 1),
  metaMenos: (ds) => ajustarMeta(ds.id, -1),

  novoObjetivo: (ds) => abrirObjetivo(null, Number(ds.tri) || null),
  editarObjetivo: (ds) => abrirObjetivo(achar(D.objetivos, ds.id)),

  novoHabito: (ds) => abrirHabito(null, ds.area),
  editarHabito: (ds) => abrirHabito(achar(D.habitos, ds.id)),
  toggleHabito: (ds) => {
    const h = achar(D.habitos, ds.id);
    if (!h || ds.dia > hojeISO()) return;
    if (h.registros[ds.dia]) delete h.registros[ds.dia]; else h.registros[ds.dia] = true;
    mudou();
    const seq = sequenciaAtual(h);
    if (h.registros[ds.dia] && [7, 21, 30, 66, 100, 365].includes(seq)) toast(`🔥 ${seq} dias seguidos de “${esc(h.nome)}”!`);
  },
  habMes: (ds) => {
    const d = Number(ds.delta);
    const agora = new Date();
    if (!d) estado.habMes = { ano: agora.getFullYear(), mes: agora.getMonth() };
    else {
      const x = new Date(estado.habMes.ano, estado.habMes.mes + d, 1);
      estado.habMes = { ano: x.getFullYear(), mes: x.getMonth() };
    }
    renderizar();
    rolarParaHoje();
  },

  novoFeito: (ds) => abrirFeito(null, ds.area),
  editarFeito: (ds) => abrirFeito(achar(D.feitos, ds.id)),

  removerFoco: (ds) => { D.foco = D.foco.filter((f) => f.id !== ds.id); mudou(); },

  novaRevisao: (ds) => abrirRevisao(ds.tipo),
  editarRevisao: (ds) => abrirRevisao(ds.tipo, achar(D.revisoes[ds.tipo], ds.id)),

  finMes: (ds) => { estado.finMes = Math.min(12, Math.max(1, (estado.finMes || mesAtualAno()) + Number(ds.delta))); renderizar(); },
  novoLancamento: () => abrirLancamento(),
  editarLancamento: (ds) => abrirLancamento(achar(D.financas.lancamentos, ds.id)),
  editarLimites: () => abrirLimites(),
  novaCaixinha: () => abrirCaixinha(),
  editarCaixinha: (ds) => abrirCaixinha(achar(D.financas.caixinhas, ds.id)),
  depositar: (ds) => abrirDeposito(achar(D.financas.caixinhas, ds.id)),

  novoItemLista: (ds) => abrirItemLista(ds.lista),
  editarItemLista: (ds) => abrirItemLista(ds.lista, achar(D.listas[ds.lista], ds.id)),

  novoDesejo: (ds) => abrirDesejo(null, ds.area),
  editarDesejo: (ds) => abrirDesejo(achar(D.desejos, ds.id)),
  desejoAoMural: (ds) => {
    const d = achar(D.desejos, ds.id);
    abrirFeito(null, d.areaId, { titulo: `Realizei: ${d.texto}`, data: d.dataFeito || hojeISO(), areaId: d.areaId });
    d.noMural = true;
    salvar();
  },

  novoDiario: (ds) => abrirDiario(null, ds.dia),
  editarDiario: (ds) => abrirDiario(achar(D.diario, ds.id)),
  diarioDia: (ds) => {
    const e = D.diario.find((x) => x.data === ds.dia);
    abrirDiario(e || null, ds.dia);
  },

  editarArea: (ds) => abrirArea(achar(D.areas, ds.id)),

  exportar: () => exportar(),
  importar: () => importar(),
  exemplos: async () => {
    if (!(await confirmar('Isso vai <strong>substituir</strong> metas, objetivos, hábitos, caixinhas, sonhos e feitos pelos exemplos. Suas configurações são mantidas.', { botao: 'Carregar exemplos' }))) return;
    carregarExemplos();
    mudou();
    toast('✨ Exemplos carregados!');
  },
  resetar: async () => {
    if (!(await confirmar('Todos os seus dados serão apagados deste navegador. Recomendamos exportar um backup antes.', { botao: 'Apagar tudo' }))) return;
    D = dadosPadrao();
    D.config.boasVindas = true;
    salvar();
    aplicarTema();
    location.hash = '#inicio';
    renderizar();
    toast('Tudo limpo. Um novo começo 🌱');
  },
};

function ajustarMeta(id, sinal) {
  const m = achar(D.metas, id);
  if (!m) return;
  const antes = progressoMeta(m);
  const passo = Number(m.passo) || 1;
  m.atual = Math.max(0, Math.round(((Number(m.atual) || 0) + sinal * passo) * 100) / 100);
  mudou();
  celebrarSeConcluiu(m, antes);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-acao]');
  if (!el || el.disabled) return;
  const fn = ACOES[el.dataset.acao];
  if (!fn) return;
  if (el.tagName === 'A' && el.dataset.acao !== 'irTrimestres') return fn(el.dataset, el, e);
  e.preventDefault();
  fn(el.dataset, el, e);
});

/* ---------- Mudanças (checkbox, selects, textareas) ---------- */
const MUDANCAS = {
  foco: (el) => { const f = achar(D.foco, el.dataset.id); if (f) { f.feito = el.checked; mudou(); } },
  objetivo: (el) => { const o = achar(D.objetivos, el.dataset.id); if (o) { o.feito = el.checked; mudou(); if (o.feito) toast('✅ Objetivo concluído!'); } },
  etapa: (el) => {
    const m = achar(D.metas, el.dataset.meta);
    const et = m && m.etapas.find((x) => x.id === el.dataset.etapa);
    if (!et) return;
    const antes = progressoMeta(m);
    et.feito = el.checked;
    mudou();
    celebrarSeConcluiu(m, antes);
  },
  metaSimples: (el) => {
    const m = achar(D.metas, el.dataset.id);
    if (!m) return;
    const antes = progressoMeta(m);
    m.concluida = el.checked;
    mudou();
    celebrarSeConcluiu(m, antes);
  },
  notaArea: (el) => {
    const a = achar(D.areas, el.dataset.id);
    if (!a) return;
    if (el.value) a.notas[el.dataset.mes] = Number(el.value); else delete a.notas[el.dataset.mes];
    mudou();
  },
  visaoArea: (el) => {
    const a = achar(D.areas, el.dataset.id);
    if (a) { a.visao = el.value.trim(); salvar(); toast('💭 Visão salva'); }
  },
  desejo: (el) => {
    const d = achar(D.desejos, el.dataset.id);
    if (!d) return;
    d.feito = el.checked;
    d.dataFeito = el.checked ? hojeISO() : '';
    mudou();
    if (d.feito) toast('🌈 Sonho realizado!', { texto: 'Levar ao mural', fn: () => ACOES.desejoAoMural({ id: d.id }) });
  },
  statusItem: (el) => {
    const i = achar(D.listas[el.dataset.lista], el.dataset.id);
    if (!i) return;
    i.status = el.value;
    if (i.status === 'concluido' && !i.data) i.data = hojeISO();
    mudou();
  },
};

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-mudar]');
  if (el && MUDANCAS[el.dataset.mudar]) MUDANCAS[el.dataset.mudar](el);
});

/* ---------- Formulários inline ---------- */
const FORMS = {
  foco: (form) => {
    const texto = form.elements.texto.value.trim();
    if (!texto) return;
    D.foco.push({ id: uid(), texto, data: hojeISO(), feito: false });
    // mantém só os últimos 60 dias
    const limite = dataISO(addDias(new Date(), -60));
    D.foco = D.foco.filter((f) => f.data >= limite);
    mudou();
    setTimeout(() => $('[data-form="foco"] input')?.focus());
  },
  config: (form) => {
    const el = form.elements;
    Object.assign(D.config, {
      nome: el.nome.value.trim(),
      palavra: el.palavra.value.trim(),
      visao: el.visao.value.trim(),
      metaLivros: Math.max(0, Number(el.metaLivros.value) || 0),
      modo: el.modo.value,
      paleta: form.querySelector('input[name="paleta"]:checked')?.value || 'lilas',
    });
    salvar();
    aplicarTema();
    renderizar();
    toast('✅ Configurações salvas');
  },
};

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  FORMS[form.dataset.form]?.(form);
});

// Prévia da paleta ao escolher nas configurações
document.addEventListener('input', (e) => {
  if (e.target.name === 'paleta' && e.target.closest('[data-form="config"]')) {
    document.documentElement.dataset.paleta = e.target.value;
  }
});

/* ---------- Início ---------- */
carregar();
aplicarTema();
montarNav();
renderizar();
if (!D.config.boasVindas) {
  D.config.boasVindas = true;
  salvar();
  boasVindas();
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !location.hostname.endsWith('claude.ai') && !location.hostname.endsWith('claudeusercontent.com')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
</body>
</html>
